services:
  - type: web
    name: specsit-backend
    runtime: docker
    # Docker (not native python) so we can install the GL system libraries
    # MediaPipe/OpenCV need for the AI PD measurement. Migrate + collectstatic
    # run from the image CMD (see ./Dockerfile).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # ── Supabase Storage (uploaded product/variant images) ──
      # Non-secret config is set here; the two access keys are entered in the
      # Render dashboard (sync: false) so they never live in git.
      - key: SUPABASE_S3_ENDPOINT
        value: https://yvnqwhgjvxktlyhnikzx.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_BUCKET
        value: allowallviews
      - key: SUPABASE_S3_REGION
        value: ap-northeast-1
      - key: SUPABASE_S3_PUBLIC_HOST
        value: yvnqwhgjvxktlyhnikzx.supabase.co/storage/v1/object/public/allowallviews
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false

  # ── Scheduled analytics warm-up ───────────────────────────────────────────
  # Model writes only mark AnalyticsSnapshot rows stale (apps/sales/signals.py);
  # nothing recomputes inline any more, because doing that on every save cost a
  # storefront page view ~233 queries across five threads. This job is what makes
  # the snapshots fresh again, so the admin dashboard reads a warm row instead of
  # paying a synchronous recompute on first open.
  #
  # --only-stale keeps a quiet interval to a single SELECT. Without it every run
  # would recompute all five snapshots (~233 queries to ap-northeast-1) whether or
  # not anything changed — the same waste, just moved onto a timer.
  #
  # dockerCommand overrides the image CMD, so this does NOT run migrate /
  # collectstatic / gunicorn. It runs the command and exits.
  #
  # Two things to know:
  #   • Render cron jobs are not offered on the free instance type.
  #   • envVars are NOT inherited from specsit-backend — the `sync: false` ones
  #     below must be set on this service too, in the dashboard.
  #   • REDIS_URL is deliberately absent: the compute path never touches the cache.
  - type: cron
    name: specsit-warm-analytics
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "*/15 * * * *"
    dockerCommand: python manage.py warm_analytics_snapshots --only-stale
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: specsit-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_API_URL
        sync: false

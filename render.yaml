services:
  - type: web
    name: specsit-backend
    runtime: docker
    # Docker (not native python) so we can install the GL system libraries
    # MediaPipe/OpenCV need for the AI PD measurement. Migrate + collectstatic
    # run from the image CMD (see ./Dockerfile).
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: specsit-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_API_URL
        sync: false

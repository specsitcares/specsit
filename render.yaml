services:
  - type: web
    name: specsit-backend
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        value: https://yvnqwhgjvxktlyhnikzx.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_BUCKET
        value: allowallviews
      - key: SUPABASE_S3_REGION
        value: ap-northeast-1
      - key: SUPABASE_S3_PUBLIC_HOST
        value: yvnqwhgjvxktlyhnikzx.supabase.co/storage/v1/object/public/allowallviews
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
  - type: cron
    name: specsit-warm-analytics
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "*/15 * * * *"
    dockerCommand: python manage.py warm_analytics_snapshots --only-stale
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: specsit-frontend
    runtime: node
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: VITE_API_URL
        sync: false

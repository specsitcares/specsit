services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-specsit}
      POSTGRES_USER: ${POSTGRES_USER:-specsit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specsit}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-specsit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://${POSTGRES_USER:-specsit}:${POSTGRES_PASSWORD:-specsit}@db:5432/${POSTGRES_DB:-specsit}
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_dev:
